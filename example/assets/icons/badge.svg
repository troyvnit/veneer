<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 48 48">
  <style>
    .ring { fill: none; stroke: url(#rim); stroke-width: 3 }
    .spark { fill: #fff; opacity: .9 }
  </style>
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a44"/>
      <stop offset="1" stop-color="#fc6076"/>
    </linearGradient>
    <linearGradient id="rim" href="#face" gradientTransform="rotate(90 .5 .5)"/>
    <radialGradient id="shine" cx=".35" cy=".3" r=".6">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="cut"><rect width="48" height="48" fill="#fff"/><circle cx="36" cy="12" r="7" fill="#000"/></mask>
    <path id="star" d="M0-4 1.2-1.2 4 0 1.2 1.2 0 4-1.2 1.2-4 0-1.2-1.2z"/>
  </defs>
  <g mask="url(#cut)">
    <circle cx="24" cy="24" r="21" fill="url(#face)"/>
    <circle cx="24" cy="24" r="21" fill="url(#shine)"/>
    <circle class="ring" cx="24" cy="24" r="19.5"/>
    <text x="24" y="31" font-size="20" font-weight="800" text-anchor="middle" fill="#fff">V</text>
  </g>
  <use xlink:href="#star" x="36" y="12" class="spark"/>
</svg>
