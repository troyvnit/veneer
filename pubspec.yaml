name: veneer
description: >-
  Real native iOS 26 UI for Flutter: Liquid Glass, UIKit bars, sheets, menus and composers driven by
  Flutter layout, with matching Flutter UI on Android.
version: 0.25.3
homepage: https://github.com/troyvnit/veneer
repository: https://github.com/troyvnit/veneer
issue_tracker: https://github.com/troyvnit/veneer/issues
screenshots:
  - description: Native tab bar, navigation bar and Liquid Glass laid out by Flutter over photos.
    path: doc/images/explore.jpg
  - description: Glass bar buttons on a photo, and floating glass buttons that open a native menu and a sheet.
    path: doc/images/place.jpg
  - description: A real UIKit sheet with native segmented control, slider and switches in Flutter content.
    path: doc/images/stay_sheet.jpg
  - description: A split layout on the unfolded iPhone Duo, with a native navigation bar per column.
    path: doc/images/duo_trips.jpg
  - description: A glass segment bar pinned under the navigation bar while photos scroll beneath it.
    path: doc/images/glass_scroll.jpg
  - description: A native UIMenu with photos and subtitles, opened from a glass button.
    path: doc/images/add_to_trip.jpg
  - description: The native composer above the keyboard, with a toolbar and a highlighted mention.
    path: doc/images/journal_compose.jpg
  - description: An assistant in a native sheet with the native prompt composer.
    path: doc/images/assistant.jpg
  - description: An in-app notification banner on Liquid Glass.
    path: doc/images/banner.jpg
  - description: Flutter replicas of the same screen, as Android and iOS 15-25 show it.
    path: doc/images/replicas.jpg
topics:
  - ios
  - liquid-glass
  - uikit
  - native
  - ui

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: VeneerPlugin
      # No native code on Android: widgets render their Flutter replicas.
      android:
        dartPluginClass: VeneerAndroid
        dartFileName: src/platform/veneer_android.dart
