name: veneer
description: >-
  Real native iOS 26 UI for Flutter: Liquid Glass, UIKit tab and navigation bars, native
  composers and sheets driven by Flutter layout, with matching Flutter UI on Android and older iOS.
version: 0.1.0
publish_to: none
homepage: https://github.com/troyvnit/veneer
repository: https://github.com/troyvnit/veneer
issue_tracker: https://github.com/troyvnit/veneer/issues
topics:
  - ios
  - liquid-glass
  - uikit
  - native
  - ui

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: VeneerPlugin
